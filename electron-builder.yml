appId: com.junyoung.ara
productName: ARA
# 게시자(설치 파일 CompanyName·Publisher)는 package.json author 에서 온다.
copyright: Copyright © 2026 Junyoung
# ME-1 E1(Electron 33): 33 부터 네이티브 애드온이 C++20 이라 소스 재빌드는 VS2022 가 있어야 한다.
# node-pty 는 N-API prebuild 를 쓰므로 재빌드하지 않는다(설치본에서 셸이 열리는지로 확인).
npmRebuild: false
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
  # M6: @vscode/ripgrep-universal 은 12개 플랫폼 rg 를 다 담고 온다(설치본에 다 넣으면 수십 MB). 이 빌드의
  # 플랫폼·아키텍처 것 하나만 남긴다 — ${platform} = 빌드하는 OS(process.platform, 맥은 맥에서 빌드), ${arch} = 대상 아키텍처.
  # 패키지의 lib/index.js(rgPath = bin/<platform>-<arch>/rg[.exe])는 그대로 두어 R2 전체 검색이 그 경로를 쓴다.
  - "!node_modules/@vscode/ripgrep-universal/bin/!(${platform}-${arch})/**"
  # M6: Monaco 는 렌더러 번들(out/renderer — CodeEditor 청크·워커)에 이미 들어 있다. dependencies 라 electron-builder 가
  # node_modules 째(73MB) 또 싣던 것을 뺀다 — main 은 monaco 를 import 하지 않는다.
  - "!node_modules/monaco-editor/**"
  - "!node_modules/@monaco-editor/**"
# M0 — 옮겨 온 코드의 고지(Orca MIT · herdr Apache-2.0 자리). 설치 폴더 resources/NOTICE 로 싣는다 —
# 설정 › 정보 › [오픈소스 고지]가 이 자리를 가리킨다. tests/fontLicenses.test.ts 가 이 줄이 있는지 본다.
extraResources:
  - from: NOTICE
    to: NOTICE
  # M14 R2 `ara` CLI — 설정 › 스킬 [CLI 설치]가 사용자 PATH 에 넣는 폴더는 이 bin 하나(ara.cmd 만 — 설치 폴더의 dll·exe 를 PATH 에 싣지 않는다).
  # 번들 스킬 ara-cli(에이전트용 사용법)는 [설치]를 누를 때 사용자 스킬 폴더로 복사한다(main/cli/bundledSkill.ts).
  - from: resources/win32/bin/ara.cmd
    to: bin/ara.cmd
  - from: resources/skills/ara-cli
    to: skills/ara-cli
# node-pty 네이티브(.node) + conpty.dll 을 asar 밖으로 풀어야 useConptyDll 경로가 런타임에
# conpty/conpty.dll 을 상대경로로 로드할 수 있다(패키지본에서 종료 창·지연 재발 방지).
asarUnpack:
  - node_modules/node-pty/**
# M4 DM-01: 데몬 진입점과 그 조각(chunks)도 asar 밖으로 — 데몬은 Electron 을 node 로 띄워 이 파일을 읽고, Windows 는 이 폴더째
# %LOCALAPPDATA%\ARA\daemon-host\<판> 으로 복사해 거기서 띄운다(업데이트가 설치 폴더 프로세스를 죽이므로 — main/daemon/launcher.ts).
  - out/main/daemonEntry.js
# M14 R2 `ara` CLI 진입점 — ara.cmd 가 app.asar.unpacked/out/main/araCli.js 를 아라 실행 파일(node 모드)로 돌린다.
  - out/main/araCli.js
  - out/main/chunks/**
# M6: rg 는 실행 파일이라 asar 안에서는 못 띄운다 — 남은 한 플랫폼 것을 asar 밖(app.asar.unpacked)으로.
# 쓰는 쪽은 rgPath 의 app.asar → app.asar.unpacked 로 바꿔 부른다(R2 WS-09).
  - node_modules/@vscode/ripgrep-universal/bin/**
# 자동 업데이트 (#98, 2026-08-23) — **배포 사이트와 같은 폴더**를 본다.
# `site/` 를 사내 웹 루트에 올리면 설치본·blockmap·latest.yml 이 전부 `downloads/` 에 함께 있다
# (`npm run site:stage` 가 거기로 복사한다). 그래서 다운로드 페이지와 업데이트 채널이 한 자리다.
#
# 2026-08-23 준영님이 정한 자리: **192.168.100.56 의 /data/jun/ARA** 를 caddy 컨테이너가
# 8899 포트로 서빙한다(`npm run site:deploy` 가 올리고 띄운다). 다운로드 페이지가
# `http://192.168.100.56:8899/`, 업데이트 채널이 그 아래 `downloads/` 다.
# 서버가 옮겨 가면 이 줄을 고쳐 다시 빌드하거나, 다시 빌드하지 않고 `ARA_UPDATE_URL`
# 환경변수로 덮어쓴다(src/main/ipc/registerUpdateIpc.ts) — 2.0 이면 덮는 값도 `…/downloads/v2/` 다.
#
# 🔴 2.0 은 **`downloads/v2/`** 를 본다(2026-10-29 준영님 결정). 1.x 피드(`downloads/latest.yml`)는
# 1.0.33 그대로 두어 2.0 을 1.x 자동 업데이트로 밀지 않는다 — 2.0 은 사이트의 "ARA 2.0 받기"로만 깔고,
# 2.0 끼리의 업데이트만 이 v2 경로로 돈다. 1.x 설치본에는 옛 주소(`downloads/`)가 박혀 있으므로
# 이 v2 피드를 볼 일이 없다. 안정된 뒤 1.x 를 2.0 으로 넘기는 것은 준영님 결정 — 그때 1.x 피드에 2.0 을 올린다.
publish:
  provider: generic
  url: http://192.168.100.56:8899/downloads/v2/
  channel: latest
win:
  target: nsis
  # 아이콘: 브랜드 키트(D:\AI\OFA\docs\brand\final\kit\ara\ara-tile.ico — 보라 판+흰 별(신고 #34 시안 B, 2.2.20), 16·20·24·32·40·48·64·256, 48 이하는 별 굵기 보정)를
  # 그대로 복사한 것. **.ico 를 주면 electron-builder 는 변환 없이 그대로 쓴다.**
  # PNG 를 주면 만들어 주긴 하는데 **256 한 장짜리**라 작업 표시줄·Alt+Tab(16~48px)에서 깨진다
  # (2026-09-04 0.9.9 설치본). 마크가 바뀌면 키트를 다시 굽고 복사한 뒤 `npm run icons:svg`(scripts/make-brand-svg.mjs 머리주석).
  icon: resources/icons/ara-icon.ico
  # 코드 서명은 MVP 미적용(SmartScreen 경고 수용). 배포 직전 EV/OV 서명 도입.
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # R14: 탐색기 주소창 `아라`/`ara` — App Paths 두 이름을 걸고 제거 때 지운다(이유는 파일 머리주석).
  include: resources/installer.nsh
  # 바로가기 이름은 `ARA` 그대로 — 시작 메뉴 검색에서 `ara` 로 찾혀야 한다(준영님: `a.r.a` 를 쳐야 해서 바꾼 이름).
  # 바탕화면 것만 installer.nsh 가 `A.R.A` 로 바꾼다(신고 #4·#5 — 이유는 그 파일의 customInstall 주석).
  shortcutName: ARA
mac:
  # ME-1 E4(2026-11-01, 계획서 6절·묶음 결정 8절): 맥은 준영님 혼자 쓴다 → Apple 인증서·공증 없이 간다.
  # 대상: dmg(설치용) + zip(electron-updater 의 맥 경로가 받는 형식 — 아래 자동 업데이트 주석 참고).
  # arch 는 적지 않는다 — 빌드하는 맥의 아키텍처 하나로 낸다(x64·arm64 둘 다 필요해지면 그때 arch 를 단다).
  target:
    - dmg
    - zip
  # mac 은 PNG 그대로(키트 ara-tile-1024.png — 보라 판, 2.2.20 부터. 그 전엔 ara-macos-1024.png 검은 판) — .icns 는 한 장에서 잘 나온다(Windows 와 달리 여기서 깨진 적 없다).
  icon: resources/icons/ara-icon.png
  # 서명: 인증서가 없으므로 electron-builder 의 서명 단계를 건너뛴다(null). 그 뒤 설치한 앱에
  # scripts/sign-adhoc.sh 로 ad-hoc 서명(codesign --sign -)과 quarantine 제거를 한다 — 절차는 docs/build-macos.md.
  # (electron-builder 26 에서 identity: "-" 로 빌드 중 ad-hoc 서명이 되는지는 맥에서 확인하지 않았다.)
  identity: null
  # hardenedRuntime·notarize 는 Developer ID 서명이 있어야 의미가 있다(공증은 서명 안 된 앱을 거부한다).
  # 인증서가 없으므로 끈다. 인증서가 생기면 둘 다 켜고 entitlements(JIT·서명 안 된 실행 메모리 허용)를 단다.
  hardenedRuntime: false
  notarize: false
  # 자동 업데이트: 맥의 electron-updater(Squirrel.Mac)는 서명된 앱만 교체한다 — ad-hoc 서명으로는
  # 거의 확실히 안 된다. 그래서 맥은 **수동 설치 전제**다(새 dmg 를 받아 덮어 설치). latest-mac.yml 은
  # 빌드 때 나오지만 사내 배포 서버에는 올리지 않는다. zip 은 서명이 생겼을 때 바로 쓰려고 미리 낸다.
