<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP: 렌더러는 self만 (계획서 §B.1). dev HMR용 ws는 electron-vite가 주입.
         connect-src data: 는 RDP wasm 때문 — 공식 패키지가 wasm 을 base64 data: URL 로 내장해
         fetch 로 읽는다(외부로 나가는 통로가 아니다, 자기 안의 바이트다). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' data: ws://127.0.0.1:*"
    />
    <title>A.R.A</title>
    <!-- 파비콘: 프롬프트 배 (design-system §8.2/8.3) — 앱 아이콘과 같은 형태의 16px 단순화판.
         물결은 한 겹만 둔다(그 크기에서 두 겹은 뭉쳐 얼룩이 된다). inline data URI 라 CSP 를 안 건드린다. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23171618'/%3E%3Cpath d='M12.4 8.2 L16.4 11.6 L12.4 15' fill='none' stroke='%23f4e6cf' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M8 17.4 q8 4.2 16 0' fill='none' stroke='%23f4e6cf' stroke-width='2.7' stroke-linecap='round'/%3E%3Cpath d='M6.5 23.5 q2.6 -2.2 5.2 0 q2.6 2.2 5.2 0 q2.6 -2.2 5.2 0' fill='none' stroke='%23b68543' stroke-width='1.9' stroke-linecap='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
