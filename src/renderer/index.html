<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP: 렌더러는 self만 (계획서 §B.1). dev HMR용 ws는 electron-vite가 주입.
         connect-src data: 는 RDP wasm 때문 — 공식 패키지가 wasm 을 base64 data: URL 로 내장해
         fetch 로 읽는다(외부로 나가는 통로가 아니다, 자기 안의 바이트다). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' data: ws://127.0.0.1:*"
    />
    <title>A.R.A</title>
    <!-- 파비콘: 별자리 노드 거미 (ara-favicon) inline data URI (design-system §8.3) -->

    />

</html>
