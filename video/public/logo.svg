<!-- 후보 A — 프롬프트 A. 이니셜 A 의 가로획을 **커서 블록**으로 바꿨다.
     터미널이라는 정체와 이름 첫 글자가 한 글자 안에서 만난다. 16px 로 줄여도 삼각 골격이 남는다. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="A.R.A">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2a2f"/>
      <stop offset="100%" stop-color="#171618"/>
    </linearGradient>
    <linearGradient id="fgA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c79f"/>
      <stop offset="100%" stop-color="#c9a26d"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgA)"/>
  <rect x="16.75" y="16.75" width="478.5" height="478.5" rx="111.25" fill="none" stroke="#ffffff" stroke-opacity=".09" stroke-width="1.5"/>
  <g fill="none" stroke="url(#fgA)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round">
    <path d="M140 376 L256 148 L372 376"/>
  </g>
  <rect x="188" y="276" width="136" height="56" rx="12" fill="#f0e0c6"/>
</svg>
