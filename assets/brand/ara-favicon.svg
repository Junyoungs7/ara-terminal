<!-- A.R.A Favicon — simplified spider, legible at 16px. -->
<!-- Original vector, design tokens (deep-dark + cyan). No Marvel IP. -->
<!-- Simplification: 3 leg pairs, solid two-node body, no constellation scatter. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="A.R.A">
  <rect width="32" height="32" rx="7" fill="#080e18"/>
  <!-- Legs: 3 symmetric pairs as thick strokes (16px-safe) -->
  <g fill="none" stroke="#38bdf8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 12 L7.5 8 L5 9.5"/>
    <path d="M13.7 15 L6.5 15 L4.5 17"/>
    <path d="M14 18 L7.5 21.5 L6 24"/>
    <path d="M18 12 L24.5 8 L27 9.5"/>
    <path d="M18.3 15 L25.5 15 L27.5 17"/>
    <path d="M18 18 L24.5 21.5 L26 24"/>
  </g>
  <!-- Cephalothorax + abdomen (two-node body) -->
  <ellipse cx="16" cy="13" rx="2.6" ry="2.3" fill="#7dd3fc"/>
  <ellipse cx="16" cy="20.5" rx="4.4" ry="5.6" fill="#7dd3fc"/>
  <!-- Sensor core -->
  <circle cx="16" cy="20.5" r="1.6" fill="#080e18"/>
</svg>
