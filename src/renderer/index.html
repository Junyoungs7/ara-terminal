<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP: 렌더러는 self만 (계획서 §B.1). dev HMR용 ws는 electron-vite가 주입.
         connect-src data: 는 RDP wasm 때문 — 공식 패키지가 wasm 을 base64 data: URL 로 내장해
         fetch 로 읽는다(외부로 나가는 통로가 아니다, 자기 안의 바이트다). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; frame-src blob: ara-doc:; font-src 'self' data:; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' data: ws://127.0.0.1:*"
    />
    <title>A.R.A</title>
    <!-- 파비콘 (design-system §8.2/8.3) = assets/brand/ara-favicon.svg 의 인라인 판.
         **아래 href 는 생성물이다 — 손으로 고치지 말 것**: `npm run icons:svg`
         (scripts/make-brand-svg.mjs 의 patchFavicon 이 이 한 줄만 갈아 끼운다).
         이 파일이 생성기 밖에 있던 탓에 2026-08-27 리브랜드에서 걷어낸 **배 마크가 여기만 남았다**.
         inline data URI 라 CSP(img-src 'self' data:)를 안 건드린다. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024' width='1024' height='1024' role='img' aria-label='ARA'%3E %3Cpath d='M528.43 709.33 C561.09 545.82 493.14 497.73 10.24 623.92 C338.38 538.17 657.07 318.26 741.83 110.94 C610.01 433.37 663.16 474.55 1013.76 491.47 C809.22 443.28 615.23 538.50 528.43 709.33Z' fill='%235E61DA'/%3E %3Cpath d='M1013.76 491.47 C863.21 484.21 513.95 763.68 472.79 913.06 C494.74 833.42 517.36 764.74 528.43 709.33 C615.23 538.50 809.22 443.28 1013.76 491.47Z' fill='%23A68DF8'/%3E %3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
