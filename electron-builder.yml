appId: com.verygood.ara
productName: A.R.A
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
# node-pty 네이티브(.node) + conpty.dll 을 asar 밖으로 풀어야 useConptyDll 경로가 런타임에
# conpty/conpty.dll 을 상대경로로 로드할 수 있다(패키지본에서 종료 창·지연 재발 방지).
asarUnpack:
  - node_modules/node-pty/**
# 자동 업데이트: **1차 배포에서는 쓰지 않는다**(준영님 결정 2026-08-15).
# 여기 `https://example.invalid/ara/updates/` 가 박혀 있었는데, 실제로 이 앱은 electron-updater 를
# 부르는 곳이 한 군데도 없다 — 설정만 남아 패키지 안에 없는 주소를 가리키는 app-update.yml 을
# 넣고 있었다. 사내 파일 서버가 정해지면 그때 provider: generic 으로 되살린다.
publish: null
win:
  target: nsis
  # 아이콘: 거미 마스터 ara-icon.svg → 1024px PNG(`npm run icons:png`). electron-builder 가
  # 512px 이상 PNG 를 주면 .ico 를 알아서 만든다 — .ico 6종을 손으로 만들지 않는다.
  # 로고가 바뀌면 그 스크립트를 다시 돌린다(scripts/make-icon-png.cjs).
  icon: resources/icons/ara-icon.png
  # 코드 서명은 MVP 미적용(SmartScreen 경고 수용). 배포 직전 EV/OV 서명 도입.
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  # 같은 PNG 에서 .icns 도 electron-builder 가 만든다. F1은 scripts/sign-adhoc.sh로 ad-hoc 스모크.
  icon: resources/icons/ara-icon.png
  # 정식 Developer ID 서명·공증은 배포 직전.
